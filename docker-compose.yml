services:
  wprdc-pipeline:
    build: .
    container_name: ckan_dbt_duckdb
    volumes:
      - ./data:/app/data
    environment:
      # Suppress ephemeral Prefect event publishing and background telemetry:
      - PREFECT_EVENTS_ENABLED=false
      - PREFECT_LOGGING_TO_API_ENABLED=false
      - PREFECT_API_SERVICES_EVENTS_WORKER_ENABLED=false